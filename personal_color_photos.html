    width: 12px;
    height: 16px;
    border-radius: 4px;
    z-index: 100;
    pointer-events: none;
    animation: fall 3.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;

/* ==========================================================================

function getActiveName() {
  return (state.currentRole === 0 ? state.playerA : state.playerB) || (state.currentRole === 0 ? "짝꿍 A" : "짝꿍 B");
}

function getHelperName() {
  return (state.currentRole === 0 ? state.playerB : state.playerA) || (state.currentRole === 0 ? "짝꿍 B" : "짝꿍 A");
}

function toggleDarkMode() {
  var root = document.documentElement;
  var isDark = root.getAttribute("data-theme") === "dark";
  root.setAttribute("data-theme", isDark ? "light" : "dark");
}

function renderHeaderProgress(step) {
  var bars = "";
  for (var j = 0; j < QUIZ_QUESTIONS.length; j++) {
    var isActive = j <= step;
    bars += '<div class="h-2.5 flex-1 rounded-full transition-all duration-300 ' + (isActive ? 'bg-indigo-600 dark:bg-indigo-400' : 'bg-slate-200 dark:bg-slate-700') + '"></div>';
  }
  return '<div class="mb-6"><div class="flex justify-between items-center mb-2"><span class="font-jua text-lg text-slate-700 dark:text-slate-300">진단 받는 사람: <b class="text-indigo-600 dark:text-indigo-400 font-normal px-3 py-1 bg-indigo-50 dark:bg-indigo-950/50 rounded-full border border-indigo-200 dark:border-indigo-800">' + escapeHtml(getActiveName()) + '</b></span><span class="text-xs font-bold text-slate-400">' + (step + 1) + ' / ' + QUIZ_QUESTIONS.length + '</span></div><div class="flex gap-1.5">' + bars + '</div></div>';
}

// 2. QUIZ QUESTION SCREEN
function loadQuestion(index, resetScores) {
  if (resetScores) {
    state.warmScore = 0;
    state.brightScore = 0;
  }
  state.currentQIndex = index;
  var q = QUIZ_QUESTIONS[index];
  var app = document.getElementById("app");

  var html = renderHeaderProgress(index) +
    '<div class="custom-card rounded-3xl p-6 md:p-8 mb-6">' +
      '<h3 class="font-jua text-2xl md:text-3xl text-slate-800 dark:text-slate-100 mb-2">' + q.title + '</h3>' +
      '<p class="text-sm md:text-base text-indigo-600 dark:text-indigo-400 font-bold mb-6">🔍 <b>도우미 ' + escapeHtml(getHelperName()) + '의 역할:</b> ' + q.sub + '</p>';

    q.drapes.forEach(function(d, idx) {

        '<div class="flex flex-col rounded-2xl overflow-hidden border-2 border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 shadow-sm">' +
          '<button onclick="openFullDrape(' + idx + ')" style="background:' + d.bg + '" class="h-40 w-full flex items-end p-4 text-white font-jua text-2xl drop-shadow-md hover:opacity-95 transition-opacity btn-bounce">' +
            '📱 ' + d.text + ' (턱 밑에 대보기)' +
          '</button>' +
          '<button onclick="selectAnswer(' + idx + ')" class="py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-jua text-lg text-center btn-bounce">' +
            '이 쪽이 얼굴이 더 사는 느낌! ✨' +
          '</button>' +
        '</div>';
    });
    html += '</div>' +
      '<div class="p-3 bg-amber-50 dark:bg-amber-950/30 rounded-xl border border-amber-200 dark:border-amber-800/40 text-amber-800 dark:text-amber-300 text-xs text-center font-jua">' +
        '💡 상단 컬러 칸을 누르면 화면 전체가 풀스크린 반사판으로 바뀝니다. 턱 밑에 대고 짝꿍과 비교하세요!' +
      '</div>';
  } else {
    html += '<div class="grid grid-cols-1 gap-3.5">';
    q.options.forEach(function(opt, idx) {
      html += 
        '<button onclick="selectAnswer(' + idx + ')" class="p-4 md:p-5 rounded-2xl border-2 border-slate-200 dark:border-slate-700 hover:border-indigo-500 dark:hover:border-indigo-400 bg-slate-50 dark:bg-slate-800/80 flex items-center gap-4 text-left btn-bounce group">' +
          '<span class="w-12 h-12 rounded-xl flex items-center justify-center text-2xl shadow-inner shrink-0" style="background:' + (opt.color || '#E2E8F0') + '">' + (opt.icon || '') + '</span>' +
          '<span class="font-jua text-lg md:text-xl text-slate-800 dark:text-slate-200 group-hover:text-indigo-600 dark:group-hover:text-indigo-400">' + opt.text + '</span>' +
        '</button>';
    });
    html += '</div>';
  }

  html += '</div>';
  app.innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ==========================================================================
   4. FULLSCREEN CHIN-UNDER DRAPE OVERLAY LOGIC
   ========================================================================== */
function openFullDrape(drapeIdx) {
  var q = QUIZ_QUESTIONS[state.currentQIndex];
  if (!q.isDrape) return;

  var currentDrape = q.drapes[drapeIdx];
  var overlay = document.getElementById("fullDrapeOverlay");
  var titleText = document.getElementById("drapeTitleText");
  var switchBar = document.getElementById("drapeSwitchBar");

  overlay.style.background = currentDrape.bg;
  titleText.textContent = currentDrape.text;

  // Build quick switch buttons at bottom so users can toggle colors while holding phone under chin
  switchBar.innerHTML = "";
  q.drapes.forEach(function(d, idx) {
    var isSelected = idx === drapeIdx;
    var btn = document.createElement("button");
    btn.className = "flex-1 py-3 px-2 rounded-xl font-jua text-sm text-white backdrop-blur-md border border-white/40 btn-bounce " + 
                    (isSelected ? "bg-white/40 ring-2 ring-white" : "bg-black/30 hover:bg-black/50");
    btn.textContent = (idx === 0 ? "👈 " : "👉 ") + d.text;
    btn.onclick = function(e) {
      e.stopPropagation();
      openFullDrape(idx);
    };
    switchBar.appendChild(btn);
  });

  overlay.classList.remove("hidden");
  overlay.classList.add("flex");
}

function openCustomColorDrape(hex, name) {
  var overlay = document.getElementById("fullDrapeOverlay");
  var titleText = document.getElementById("drapeTitleText");
  var switchBar = document.getElementById("drapeSwitchBar");

  overlay.style.background = hex;
  titleText.textContent = name;
  switchBar.innerHTML = "";

  overlay.classList.remove("hidden");
  overlay.classList.add("flex");
}

function closeFullDrape() {
  var overlay = document.getElementById("fullDrapeOverlay");
  overlay.classList.add("hidden");
  overlay.classList.remove("flex");
}

document.getElementById("fullDrapeOverlay").onclick = function() {
  closeFullDrape();
};

function selectAnswer(answerIdx) {
  var q = QUIZ_QUESTIONS[state.currentQIndex];
  var val = q.isDrape ? q.drapes[answerIdx].value : q.options[answerIdx].value;

  if (q.category === "undertone") {
    state.warmScore += val;
  } else if (q.category === "bright") {
    state.brightScore += val;
  }

  if (state.currentQIndex < QUIZ_QUESTIONS.length - 1) {
    loadQuestion(state.currentQIndex + 1, false);
  } else {
    triggerDrumroll();
  }
}

// 5. DRUMROLL VISUAL LOADING SCREEN
function triggerDrumroll() {
  var app = document.getElementById("app");
  var messages = [
    "피부 밑 톤 반사율 스캔 중... 🔍",
    "골드 vs 실버 온도감 측정 완료! 💍",
    "스타들의 BEST/WORST 코디 비교 중... 📸",
    "인생 포토카드 찍을 준비 완료! 🎨"
  ];
  
  var count = 0;
  app.innerHTML = 
    '<div class="custom-card rounded-3xl p-10 text-center max-w-lg mx-auto my-12">' +
      '<div id="spinCircle" class="w-32 h-32 rounded-full mx-auto mb-6 transition-all duration-300 shadow-2xl flex items-center justify-center text-4xl animate-spin">🎨</div>' +
      '<h3 class="font-jua text-3xl text-slate-800 dark:text-slate-100 mb-2">두구두구두구... 🥁</h3>' +
      '<p id="spinMsg" class="font-jua text-lg text-indigo-600 dark:text-indigo-400">' + messages[0] + '</p>' +
    '</div>';

  var colors = ["#FF6B4A", "#5C6BC0", "#B45309", "#4338CA"];
  var interval = setInterval(function() {
    count++;
    var circle = document.getElementById("spinCircle");
    var msg = document.getElementById("spinMsg");
    if (circle && msg) {
      circle.style.backgroundColor = colors[count % colors.length];
      msg.textContent = messages[count % messages.length];
    }
  }, 400);

  setTimeout(function() {
    clearInterval(interval);
    showResult();
  }, 2000);
}

        '<h4 class="font-jua text-xl text-emerald-600 dark:text-emerald-400 mb-3">💖 나를 살려주는 BEST 찰떡 컬러</h4>' +
        '<div class="grid grid-cols-3 gap-2.5">' +
          season.best.map(function(c) {
            return '<button onclick="openCustomColorDrape(\'' + c[1] + '\', \'' + c[0] + '\')" class="h-20 rounded-2xl p-2.5 flex flex-col justify-end text-left text-white font-jua text-sm shadow-md btn-bounce transition-transform" style="background:' + c[1] + '">' +
              '<span class="drop-shadow-md">' + c[0] + '</span>' +
            '</button>';
          }).join("") +
        '</div>' +
        '<p class="text-xs text-slate-400 mt-3 text-center">색상을 누르면 화면 전체가 턱 밑 반사판으로 전환됩니다.</p>' +
      '</div>' +

      '<div class="custom-card rounded-3xl p-6">' +
        '<h4 class="font-jua text-xl text-rose-500 dark:text-rose-400 mb-3">⚠️ 얼굴빛을 죽이는 WORST 회피 컬러</h4>' +
        '<div class="grid grid-cols-3 gap-2.5">' +
          season.avoid.map(function(c) {
            return '<button onclick="openCustomColorDrape(\'' + c[1] + '\', \'' + c[0] + '\')" class="h-20 rounded-2xl p-2.5 flex flex-col justify-end text-left text-white font-jua text-sm shadow-md btn-bounce transition-transform" style="background:' + c[1] + '">' +
              '<span class="drop-shadow-md">' + c[0] + '</span>' +
            '</button>';
          }).join("") +
        '</div>' +
        '<p class="text-xs text-slate-400 mt-3 text-center">얼굴이 창백해지거나 칙칙해지는지 턱 아래 대어 비교해 보세요.</p>' +
      '</div>' +
    '</div>' +

    // Printable Photo Card Generator Box
    '<div class="custom-card rounded-3xl p-6 mb-6 text-center border-2 border-indigo-500/30 bg-indigo-50/50 dark:bg-indigo-950/20">' +
      '<h4 class="font-jua text-2xl text-indigo-600 dark:text-indigo-400 mb-2">📸 나만의 퍼스널 컬러 포토카드 소장하기</h4>' +
      '<p class="text-sm text-slate-600 dark:text-slate-400 mb-4">내 이름과 퍼스널 컬러가 담긴 고화질 수료 포토카드를 생성해 보세요!</p>' +
      '<button onclick="generatePhotoCard()" class="px-6 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-jua text-lg rounded-2xl shadow-lg btn-bounce">' +
        '🎴 포토카드 생성 및 저장하기' +
      '</button>' +
      '<div id="photoCardOutput" class="mt-4 flex flex-col items-center justify-center"></div>' +
    '</div>';

  // Buddy Duo Analysis (Unlocks when both A and B complete)
  if (state.completedResults.length === 2) {
    html += renderBuddyDuoReport();
  }

  // Action Buttons
  html += '<div class="flex flex-wrap gap-3 mt-8">';
  if (state.completedResults.length < 2) {
    html += '<button onclick="swapPlayer()" class="flex-1 py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-jua text-xl rounded-2xl shadow-lg btn-bounce">🔄 역할 바꿈: ' + escapeHtml(getHelperName()) + ' 차례 시작</button>';
  }
  html += '<button onclick="loadQuestion(0, true)" class="py-4 px-6 bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-200 font-jua text-xl rounded-2xl btn-bounce">다시 하기</button>';
  html += '<button onclick="renderIntro()" class="py-4 px-6 bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-200 font-jua text-xl rounded-2xl btn-bounce">처음 화면</button>';
  html += '</div>';

  app.innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function swapPlayer() {
  state.currentRole = state.currentRole === 0 ? 1 : 0;
  loadQuestion(0, true);
}

// Render Duo Buddy Chemistry Report
function renderBuddyDuoReport() {
  var rA = state.completedResults[0];
  var rB = state.completedResults[1];
  
  var isSameSeason = rA.seasonKey === rB.seasonKey;
  var isSameTone = (rA.seasonKey === "spring" || rA.seasonKey === "autumn") === (rB.seasonKey === "spring" || rB.seasonKey === "autumn");

  var score = isSameSeason ? 99 : (isSameTone ? 88 : 75);
  var title = isSameSeason ? "👯 99% 쌍둥이 톤파괴 듀오!" : (isSameTone ? "🤝 88% 온기가 통하는 웜/쿨 단짝!" : "⚡ 75% 극과 극 반대 매력 꿀잼 듀오!");
  var desc = isSameSeason 
    ? "서로의 베스트 컬러가 완벽히 일치해요! 옷이나 필통 색상을 맞춰서 짝꿍템을 만들어 보세요."
    : (isSameTone 
      ? "톤의 온도감(웜/쿨)이 비슷해서 나란히 서면 분위기가 자연스럽게 잘 어울려요!"
      : "서로 완전 반대 성향의 톤이에요! 상대방의 베스트 색상을 빌려 대보면 차이를 확실히 느낄 수 있어요.");

  return '<div class="custom-card rounded-3xl p-6 md:p-8 mb-6 border-4 border-amber-400 bg-amber-500/10 glow-pulse">' +
      '<div class="flex justify-between items-center mb-3">' +
        '<h4 class="font-jua text-2xl md:text-3xl text-amber-600 dark:text-amber-400">🔥 짝꿍 케미 보고서</h4>' +
        '<span class="font-jua text-2xl px-4 py-1.5 bg-amber-500 text-white rounded-full shadow-md">' + score + '점</span>' +
      '</div>' +
      '<h5 class="font-jua text-xl text-slate-800 dark:text-slate-100 mb-2">' + rA.name + ' × ' + rB.name + ' · ' + title + '</h5>' +
      '<p class="text-slate-600 dark:text-slate-300 text-base mb-4 leading-relaxed">' + desc + '</p>' +
      
      '<div class="p-4 bg-white dark:bg-slate-800 rounded-2xl border border-amber-200 dark:border-amber-800/50">' +
        '<h6 class="font-jua text-lg text-amber-600 dark:text-amber-400 mb-2">🎯 오늘의 짝꿍 미션 챌린지</h6>' +
        '<ul class="text-sm text-slate-700 dark:text-slate-300 space-y-2 font-bold">' +
          '<li>1. 쉬는 시간에 서로의 행운 컬러 아이템 한 개씩 교환해서 인증샷 찍기 📸</li>' +
          '<li>2. 짝꿍 얼굴 밑에 베스트 컬러 대어주고 “오늘 올킬이다!” 말해주기 💬</li>' +
        '</ul>' +
      '</div>' +
    '</div>';
}

/* ==========================================================================
   7. Canvas PhotoCard Generator
   ========================================================================== */
function generatePhotoCard() {
  var activeRes = state.completedResults.find(function(r) { return r.role === state.currentRole; });
  if (!activeRes) return;

  var season = SEASONS[activeRes.seasonKey];

  var canvas = document.createElement("canvas");
  canvas.width = 600;
  canvas.height = 850;
  var ctx = canvas.getContext("2d");

  // Background Gradient
  var grad = ctx.createLinearGradient(0, 0, 600, 850);
  grad.addColorStop(0, season.color);
  grad.addColorStop(1, "#0F172A");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 600, 850);

  // Frame Border
  ctx.strokeStyle = "rgba(255, 255, 255, 0.3)";
  ctx.lineWidth = 6;
  ctx.strokeRect(20, 20, 560, 810);

  // Header Title
  ctx.fillStyle = "#FFFFFF";
  ctx.font = "bold 28px 'Jua', sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("PERSONAL COLOR STUDENT ID", 300, 75);

  // Avatar Icon Box
  ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
  ctx.beginPath();
  if (ctx.roundRect) {
    ctx.roundRect(150, 110, 300, 180, 24);
  } else {
    ctx.rect(150, 110, 300, 180);
  }
  ctx.fill();

  ctx.font = "80px sans-serif";
  ctx.fillText("🎨", 300, 220);

  // Student Name
  ctx.fillStyle = "#FFFFFF";
  ctx.font = "bold 44px 'Jua', sans-serif";
  ctx.fillText(activeRes.name, 300, 340);

  // Season Name Tag
  ctx.fillStyle = "#FBBF24";
  ctx.font = "bold 32px 'Jua', sans-serif";
  ctx.fillText(season.name, 300, 390);

  // SubType Tag
  ctx.fillStyle = "#FFFFFF";
  ctx.font = "24px 'Jua', sans-serif";
  ctx.fillText(activeRes.subTypeName, 300, 430);

  // Best Color Chips
  ctx.fillText("BEST PALETTE", 300, 490);
  var startX = 120;
  season.best.slice(0, 5).forEach(function(c, i) {
    ctx.fillStyle = c[1];
    ctx.beginPath();
    ctx.arc(startX + i * 90, 540, 32, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#FFFFFF";
    ctx.lineWidth = 3;
    ctx.stroke();
  });

  // Celeb & Lucky Item Info
  var celebNames = season.celebs.map(function(c){ return c.name; }).join(", ");
  ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
  ctx.font = "20px sans-serif";
  ctx.fillText("⭐ 대표 스타: " + celebNames, 300, 630);
  ctx.fillText("🍀 행운 아이템: " + season.luckyItem, 300, 670);

  // Footer Tag
  ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
  ctx.font = "18px sans-serif";
  ctx.fillText("짝꿍과 함께 찾는 퍼스널 컬러 Lab 수료 인증", 300, 780);

  // Display Image & Download Button
  var outputContainer = document.getElementById("photoCardOutput");
  outputContainer.innerHTML = "";

  var img = document.createElement("img");
  img.src = canvas.toDataURL("image/png");
  img.className = "w-64 md:w-80 rounded-2xl shadow-2xl border-4 border-white my-3";

  var downloadBtn = document.createElement("a");
  downloadBtn.href = canvas.toDataURL("image/png");
  downloadBtn.download = activeRes.name + "_퍼스널컬러_포토카드.png";
  downloadBtn.className = "inline-block px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-jua text-base rounded-xl shadow-md btn-bounce mt-1";
  downloadBtn.textContent = "💾 이미지 다운로드 받기";

  outputContainer.appendChild(img);
  outputContainer.appendChild(downloadBtn);
}

/* ==========================================================================
   8. Confetti Generator
   ========================================================================== */
function spawnConfetti() {
  var colors = ["#FF6B4A", "#5C6BC0", "#B45309", "#4338CA", "#F59E0B", "#10B981", "#EC4899"];
  for (var i = 0; i < 40; i++) {
    var p = document.createElement("div");
    p.className = "confetti-particle";
    p.style.left = Math.random() * 100 + "vw";
    p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDelay = (Math.random() * 0.8) + "s";
    document.body.appendChild(p);

    (function(node) {
      setTimeout(function() { node.remove(); }, 3500);
    })(p);
  }
}

// Utility: Escape HTML string
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, function(m) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
  });
}

// Initialize on Window Load
window.onload = function() {
  renderIntro();
};
