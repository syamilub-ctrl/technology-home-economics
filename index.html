<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#126b52">
  <title>기술·가정 수업 자료실</title>
  <style>
    :root{--green:#126b52;--green2:#20966f;--ink:#17352d;--muted:#60736d;--line:#dce9e4;--soft:#f2faf7;--white:#fff;--shadow:0 14px 38px rgba(20,75,60,.12)}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,sans-serif;background:linear-gradient(180deg,#eaf8f2 0,#f8fbfa 360px,#f8fbfa 100%)}
    button,input{font:inherit}.wrap{width:min(1080px,calc(100% - 32px));margin:auto}.hero{padding:54px 0 40px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(104,210,165,.18);right:-80px;top:-130px}
    .eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:#fff;color:var(--green);font-size:13px;font-weight:800;box-shadow:0 6px 18px rgba(20,75,60,.08)}
    h1{font-size:clamp(31px,6vw,52px);letter-spacing:-.055em;line-height:1.08;margin:18px 0 13px}.lead{color:var(--muted);font-size:clamp(15px,2.2vw,18px);line-height:1.7;margin:0;max-width:650px}.toolbar{margin-top:28px;display:flex;gap:10px;align-items:center}.search{width:min(520px,100%);display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:0 15px;box-shadow:0 8px 25px rgba(20,75,60,.08)}.search input{width:100%;height:52px;border:0;outline:0;color:var(--ink);background:transparent}.search input::placeholder{color:#8da19a}
    main{padding:10px 0 70px}.section-head{display:flex;justify-content:space-between;gap:16px;align-items:end;margin:0 0 18px}.section-head h2{font-size:23px;letter-spacing:-.04em;margin:0}.count{font-size:13px;color:var(--muted);font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{display:flex;flex-direction:column;min-height:235px;padding:23px;border-radius:23px;background:var(--white);border:1px solid var(--line);box-shadow:0 8px 26px rgba(20,75,60,.07);transition:.18s ease}.card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:#b9d9ce}.icon{width:54px;height:54px;display:grid;place-items:center;border-radius:17px;background:linear-gradient(145deg,#dff8ee,#f2fbf7);font-size:28px}.tag{margin-top:17px;color:var(--green2);font-size:12px;font-weight:900}.card h3{font-size:20px;letter-spacing:-.04em;margin:7px 0 8px}.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.6;flex:1}.open{display:inline-flex;justify-content:center;align-items:center;margin-top:20px;height:43px;border-radius:13px;background:var(--green);color:white;font-weight:850;text-decoration:none}.empty,.error{grid-column:1/-1;padding:42px 20px;text-align:center;border:1px dashed #b8d4ca;border-radius:22px;background:rgba(255,255,255,.72);color:var(--muted)}.loader{width:30px;height:30px;border:3px solid #d7ebe4;border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}footer{border-top:1px solid var(--line);padding:24px 0 36px;text-align:center;color:#789089;font-size:13px}
    @media(max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.wrap{width:min(100% - 22px,1080px)}.hero{padding:35px 0 30px}.grid{grid-template-columns:1fr}.card{min-height:215px}.section-head{align-items:center}}
  </style>
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <div class="eyebrow">🌱 배움이 생활로 이어지는 공간</div>
      <h1>기술·가정 수업 자료실</h1>
      <p class="lead">수업에 필요한 학생 활동을 골라 바로 시작하세요. 새 HTML 활동을 저장소에 올리면 이 화면의 목록에도 자동으로 추가됩니다.</p>
      <div class="toolbar"><label class="search" aria-label="자료 검색"><span>🔎</span><input id="search" type="search" placeholder="활동 이름 또는 파일명으로 검색"></label></div>
    </div>
  </header>
  <main class="wrap">
    <div class="section-head"><h2>학생 활동</h2><div class="count" id="count">자료 확인 중</div></div>
    <section class="grid" id="grid" aria-live="polite"><div class="empty"><div class="loader"></div>자료를 불러오고 있습니다.</div></section>
  </main>
  <footer><div class="wrap">기술·가정 수업 자료실 · GitHub Pages</div></footer>
  <script>
    const owner='syamilub-ctrl';
    const repo='technology-home-economics';
    const branch='main';
    const pagesBase=`https://${owner}.github.io/${repo}/`;
    const known={
      'life-resource.html':{title:'생활자원의 이해와 관리',desc:'생활자원의 종류와 특성, 관리 방법, 선택과 기회비용, 시간 관리를 탐구하는 학생 활동',tag:'기술·가정 · 생활자원',icon:'🌿'},
      'meal-planner.html':{title:'식단 작성 프로그램',desc:'식품군과 영양을 고려하여 아침·점심·저녁 식단을 직접 구성하는 학생 활동',tag:'기술·가정 · 식생활',icon:'🥗'},
      'housing-culture-activities.html':{title:'더불어 사는 주생활 문화',desc:'주거 가치관, 생활양식, 이웃과 함께하는 주거 형태와 주거 문화를 탐구하는 4차시 활동',tag:'기술·가정 · 주생활',icon:'🏡'},
      'housing-values.html':{title:'더불어 사는 주생활 문화',desc:'주거 가치관, 생활양식, 이웃과 함께하는 주거 형태와 주거 문화를 탐구하는 4차시 활동',tag:'기술·가정 · 주생활',icon:'🏡'}
    };
    let resources=[];
    const pretty=name=>name.replace(/\.html$/i,'').replace(/[-_]+/g,' ').trim();
    const iconFor=name=>/meal|food|diet/i.test(name)?'🥗':/house|home|housing/i.test(name)?'🏡':/resource|time/i.test(name)?'🌿':'🧩';
    function render(query=''){
      const q=query.trim().toLowerCase();
      const filtered=resources.filter(x=>`${x.title} ${x.name} ${x.desc}`.toLowerCase().includes(q));
      document.getElementById('count').textContent=`총 ${filtered.length}개`;
      document.getElementById('grid').innerHTML=filtered.length?filtered.map(x=>`<article class="card"><div class="icon">${x.icon}</div><div class="tag">${x.tag}</div><h3>${x.title}</h3><p>${x.desc}</p><a class="open" href="${pagesBase}${encodeURIComponent(x.name)}">활동 시작</a></article>`).join(''):`<div class="empty">검색 결과가 없습니다.</div>`;
    }
    async function load(){
      try{
        const response=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/?ref=${branch}`,{headers:{Accept:'application/vnd.github+json'}});
        if(!response.ok)throw new Error('목록 요청 실패');
        const files=await response.json();
        resources=files.filter(f=>f.type==='file'&&/\.html$/i.test(f.name)&&f.name.toLowerCase()!=='index.html').map(f=>{
          const meta=known[f.name]||{};
          return {name:f.name,title:meta.title||pretty(f.name),desc:meta.desc||'클릭하여 학생 활동을 시작하세요.',tag:meta.tag||'기술·가정 · 학생 활동',icon:meta.icon||iconFor(f.name)};
        }).sort((a,b)=>(known[b.name]?1:0)-(known[a.name]?1:0)||a.title.localeCompare(b.title,'ko'));
        render();
      }catch(error){
        resources=['life-resource.html','housing-culture-activities.html','meal-planner.html'].map(name=>({name,...known[name]}));
        render();
      }
    }
    document.getElementById('search').addEventListener('input',e=>render(e.target.value));
    load();
  </script>
</body>
</html>
